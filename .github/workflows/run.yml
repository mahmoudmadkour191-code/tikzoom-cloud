name: run

on:
  workflow_dispatch:

concurrency:
  group: tikzoom-run
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install platform dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-gh.txt

      - name: Git identity for state commits
        run: |
          git config user.name "tikzoom-state"
          git config user.email "tikzoom-state@users.noreply.github.com"

      - name: Run TikZoom platform cycle (~5.4h then hand over)
        timeout-minutes: 345
        env:
          BOT_TOKEN: ${{ secrets.PLATFORM_BOT_TOKEN }}
          ADMIN_IDS: ${{ secrets.ADMIN_IDS }}
          ADMIN_CONTACT: ${{ secrets.ADMIN_CONTACT }}
          FERNET_KEY: ${{ secrets.FERNET_KEY }}
          STATE_KEY: ${{ secrets.STATE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          TIKZOOM_SANDBOX: process
          TIKZOOM_SOFT_LIMIT_MIN: "325"
          TIKZOOM_STATE_INTERVAL_MIN: "15"
          PYTHONUNBUFFERED: "1"
        run: python -m app.gh_main

      - name: Final state commit (safety net)
        if: always()
        run: |
          git add runtime_state/ 2>/dev/null || true
          git diff --cached --quiet || git commit -m "state: final snapshot $(date -u +%FT%TZ)" || true
          git pull --rebase origin main || true
          git push origin HEAD:main || true
