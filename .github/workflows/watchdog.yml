name: watchdog

# Revives the platform if the main run died (crash, runner failure, etc.).
# The main run re-schedules itself every ~5.4 hours; this is the safety net.

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  actions: write

jobs:
  revive:
    runs-on: ubuntu-latest
    steps:
      - name: Check main run health & revive if dead
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -e
          # Any active (queued/in_progress) run of the main workflow?
          ACTIVE=$(curl -s -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/$REPO/actions/workflows/run.yml/runs?per_page=10" \
            | python3 -c '
          import json,sys
          d=json.load(sys.stdin)
          runs=d.get("workflow_runs",[])
          alive=[r for r in runs if r.get("status") in ("in_progress","queued","waiting","pending")]
          print(len(alive))
          ')
          echo "active runs: $ACTIVE"
          if [ "$ACTIVE" != "0" ]; then
            echo "Main run is alive or queued — nothing to do."
            exit 0
          fi

          # How stale is the last completed run?
          STALE=$(curl -s -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/$REPO/actions/workflows/run.yml/runs?per_page=1" \
            | python3 -c '
          import json,sys,datetime
          d=json.load(sys.stdin)
          runs=d.get("workflow_runs",[])
          if not runs:
              print("9999"); raise SystemExit
          last=runs[0]
          t=last.get("completed_at") or last.get("created_at")
          dt=datetime.datetime.fromisoformat(t.replace("Z","+00:00"))
          age=(datetime.datetime.now(datetime.timezone.utc)-dt).total_seconds()/60
          print(f"{age:.0f}")
          ')
          echo "minutes since last run ended: $STALE"
          if [ "$STALE" -lt "20" ]; then
            echo "Last run ended recently — giving it time."
            exit 0
          fi

          echo "Reviving TikZoom…"
          curl -s -X POST -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$REPO/actions/workflows/run.yml/dispatches" \
            -d '{"ref":"main"}'
          echo "Dispatched."
